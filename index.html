<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a3d">
<title>Parts Inventory</title>
<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#1c2426;--mute:#667275;--line:#d8dcd5;--brand:#1f3a3d;--low:#c4540a;--lowbg:#fdeee2;--ok:#2d7a4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1b;--card:#1b2527;--ink:#e8edec;--mute:#93a3a5;--line:#2c3a3c;--brand:#5fb3a8;--low:#f08a4b;--lowbg:#3a2417;--ok:#6cc596}}
:root[data-theme="dark"]{--bg:#121a1b;--card:#1b2527;--ink:#e8edec;--mute:#93a3a5;--line:#2c3a3c;--brand:#5fb3a8;--low:#f08a4b;--lowbg:#3a2417;--ok:#6cc596}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:640px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 8px;z-index:2}
h1{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;padding:8px;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;font:inherit}
.tab.on{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.part{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.part.low{border-left:5px solid var(--low)}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px}
.warn{display:inline-block;background:var(--lowbg);color:var(--low);border-radius:6px;padding:0 6px;font-size:13px;margin-top:2px}
.qty{display:flex;align-items:center;gap:6px}
.qty b{min-width:34px;text-align:center;font-size:20px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;line-height:1}
.edit{background:none;border:0;color:var(--mute);font-size:20px;padding:6px}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--bg);border:0;border-radius:28px;padding:15px 22px;font:600 16px system-ui;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);font:600 16px system-ui;background:var(--bg);color:var(--ink)}
.btns .save{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.btns .del{color:var(--low)}
.foot{display:flex;gap:8px;margin-top:18px}
.foot button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit}
.scan{flex:none;padding:11px 16px;border-radius:10px;border:0;background:var(--brand);color:var(--bg);font:600 16px system-ui}
#vid{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border-radius:12px;display:block}
.toast{z-index:99;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Parts inventory</h1>
  <div class="row"><input id="q" type="search" placeholder="Search name, part no., or TV model" aria-label="Search parts"><button class="scan" id="scanBtn">Scan</button></div>
  <div class="tabs">
    <button class="tab on" data-f="all">All <span id="nAll"></span></button>
    <button class="tab" data-f="low">Low stock <span id="nLow"></span></button>
  </div>
</header>
<main id="list"></main>
<div class="foot">
  <button id="copy">Copy as CSV</button>
  <button id="imp">Paste CSV to import</button>
</div>
<button class="fab" id="add">+ Add part</button>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font-size:19px">Add part</h2>
  <label for="fName">Part name</label><input id="fName" placeholder="e.g. Power supply board">
  <label for="fNum">Part number or bin (optional)</label><div class="row"><input id="fNum" placeholder="e.g. BN44-00932A / Shelf B2"><button class="scan" id="fScan" type="button">Scan</button></div>
  <label for="fModels">Fits models (optional, separate with commas)</label><input id="fModels" placeholder="e.g. UN55TU8000, UN50TU8000">
  <div class="row">
    <div><label for="fQty">In stock</label><input id="fQty" type="number" inputmode="numeric" min="0" value="1"></div>
    <div><label for="fMin">Reorder at</label><input id="fMin" type="number" inputmode="numeric" min="0" value="1"></div>
    <div><label for="fCost">Cost $</label><input id="fCost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
  </div>
  <div class="btns">
    <button class="del" id="bDel">Delete</button>
    <button id="bCan">Cancel</button>
    <button class="save" id="bSave">Save part</button>
  </div>
</dialog>

<dialog id="sc">
  <h2 style="margin:0 0 10px;font-size:19px">Scan barcode</h2>
  <video id="vid" playsinline muted></video>
  <div class="meta" id="scMsg" style="margin-top:8px">Starting camera…</div>
  <div class="btns"><button id="scPhoto" type="button">Take photo</button><button id="scClose">Cancel</button></div>
  <input type="file" id="scFile" accept="image/*" capture="environment" hidden>
</dialog>
<div id="reader" style="display:none"></div>
<script src="html5-qrcode.min.js"></script>
<dialog id="hit">
  <h2 id="hName" style="margin:0 0 2px;font-size:19px"></h2>
  <div class="meta" id="hNum"></div>
  <div class="qty" style="justify-content:center;margin:14px 0"><button id="hDec" aria-label="Use one">−</button><b id="hQty" style="font-size:30px"></b><button id="hInc" aria-label="Add one">+</button></div>
  <div class="btns"><button id="hEdit">Edit</button><button id="hNext">Scan next</button><button class="save" id="hDone">Done</button></div>
</dialog>

<script>
const KEY='parts-inventory-v1';
let parts=[],filter='all',editId=null;
const P=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Preferences;
async function load(){
  let v=null;
  try{const p=P();if(p)v=(await p.get({key:KEY})).value}catch(e){}
  if(!v){try{v=localStorage.getItem(KEY)}catch(e){}}
  try{parts=JSON.parse(v||'[]')}catch(e){parts=[]}
  render();
}
const $=id=>document.getElementById(id);
function save(){const v=JSON.stringify(parts);try{localStorage.setItem(KEY,v)}catch(e){}try{const p=P();if(p)p.set({key:KEY,value:v})}catch(e){toast('Could not save')}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isLow=p=>p.qty<=p.min;
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function match(p,q){
  const toks=q.split(/\s+/).map(norm).filter(Boolean);
  const hay=norm(p.name+p.num+(p.models||''));
  return toks.every(t=>hay.includes(t));
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  $('nAll').textContent='('+parts.length+')';
  $('nLow').textContent='('+parts.filter(isLow).length+')';
  const rows=parts.filter(p=>(filter==='all'||isLow(p))&&match(p,q))
    .sort((a,b)=>a.name.localeCompare(b.name));
  $('list').innerHTML=rows.length?rows.map(p=>`
    <div class="part ${isLow(p)?'low':''}">
      <div class="info"><div class="name">${esc(p.name)}</div>
      <div class="meta">${esc(p.num||'No part number')}${p.cost?' · $'+p.cost.toFixed(2):''}</div>
      ${p.models?`<div class="meta">Fits: ${esc(p.models)}</div>`:''}
      ${isLow(p)?`<span class="warn">${p.qty===0?'Out of stock':'Reorder soon'}</span>`:''}</div>
      <div class="qty"><button data-a="dec" data-id="${p.id}" aria-label="Use one">−</button><b>${p.qty}</b><button data-a="inc" data-id="${p.id}" aria-label="Add one">+</button></div>
      <button class="edit" data-a="edit" data-id="${p.id}" aria-label="Edit ${esc(p.name)}">✎</button>
    </div>`).join(''):
    `<div class="empty">${parts.length?'No parts match.':'No parts yet. Tap “Add part” to enter your first one.'}</div>`;
}
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const p=parts.find(x=>x.id===b.dataset.id);if(!p)return;
  if(b.dataset.a==='inc')p.qty++;
  if(b.dataset.a==='dec')p.qty=Math.max(0,p.qty-1);
  if(b.dataset.a==='edit')return openDlg(p);
  save();render();
});
function openDlg(p){
  editId=p?p.id:null;
  $('dt').textContent=p?'Edit part':'Add part';
  $('fName').value=p?p.name:'';$('fNum').value=p?p.num:'';$('fModels').value=p?(p.models||''):'';
  $('fQty').value=p?p.qty:1;$('fMin').value=p?p.min:1;$('fCost').value=p&&p.cost?p.cost:'';
  $('bDel').style.display=p?'':'none';
  $('dlg').showModal();
}
$('add').onclick=()=>openDlg(null);
$('bCan').onclick=()=>$('dlg').close();
$('bSave').onclick=()=>{
  const name=$('fName').value.trim();
  if(!name){toast('Enter a part name');return}
  const d={name,num:$('fNum').value.trim(),models:$('fModels').value.trim(),qty:Math.max(0,parseInt($('fQty').value)||0),min:Math.max(0,parseInt($('fMin').value)||0),cost:parseFloat($('fCost').value)||0};
  if(editId)Object.assign(parts.find(x=>x.id===editId),d);
  else parts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),...d});
  save();render();$('dlg').close();
};
$('bDel').onclick=()=>{
  if(confirm('Delete this part?')){parts=parts.filter(x=>x.id!==editId);save();render();$('dlg').close()}
};
$('q').oninput=render;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  filter=t.dataset.f;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));render();
});
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
$('copy').onclick=async()=>{
  const csv='name,part_number,qty,reorder_at,cost,models\n'+parts.map(p=>[q(p.name),q(p.num),p.qty,p.min,p.cost,q(p.models||'')].join(',')).join('\n');
  try{await navigator.clipboard.writeText(csv);toast('CSV copied. Paste it into Notes or a sheet.')}catch(e){prompt('Copy this CSV:',csv)}
};
$('imp').onclick=()=>{
  const t=prompt('Paste CSV (name,part_number,qty,reorder_at,cost,models):');if(!t)return;
  let n=0;
  t.split(/\r?\n/).forEach((l,i)=>{
    const c=(l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(s=>s.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'));
    if(!c[0]||(i===0&&c[0].toLowerCase()==='name'))return;
    parts.push({id:Date.now().toString(36)+i,name:c[0],num:c[1]||'',qty:parseInt(c[2])||0,min:parseInt(c[3])||0,cost:parseFloat(c[4])||0,models:c[5]||''});n++;
  });
  save();render();toast(n+' parts imported');
};
let stream=null,timer=0,mode='lookup',det=null,hitId=null;
const FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','qr_code','data_matrix'];
const hasBD=()=>'BarcodeDetector' in window;
function getDet(){if(!det){try{det=new BarcodeDetector({formats:FORMATS})}catch(e){det=new BarcodeDetector()}}return det}
async function decodeBlob(blob){
  if(hasBD()){try{const r=await getDet().detect(await createImageBitmap(blob));if(r.length)return r[0].rawValue.trim()}catch(e){}}
  if(window.Html5Qrcode){
    const h=new Html5Qrcode('reader',{verbose:false});
    try{return String(await h.scanFile(new File([blob],'scan.jpg',{type:blob.type||'image/jpeg'}),false)).trim()}catch(e){}
    finally{try{h.clear()}catch(e){}}
  }
  return null;
}
async function startScan(m){
  mode=m;
  $('scMsg').textContent='Starting camera\u2026';$('sc').showModal();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoCameraAccess'};
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    $('vid').srcObject=stream;await $('vid').play();
    $('scMsg').textContent='Point the camera at a barcode.';
    loop();
  }catch(e){
    stopScan();
    $('scMsg').textContent='Live camera is not available here ('+(e&&e.name||'error')+'). Tap Take photo and snap the barcode instead.';
  }
}
async function loop(){
  if(!stream)return;
  let code=null;
  try{
    const v=$('vid');
    if(hasBD()){const r=await getDet().detect(v);if(r.length)code=r[0].rawValue.trim()}
    else if(window.Html5Qrcode&&v.videoWidth){
      const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
      if(b)code=await decodeBlob(b);
    }
  }catch(e){}
  if(!stream)return;
  if(code){stopScan();$('sc').close();navigator.vibrate&&navigator.vibrate(60);onCode(code);return}
  timer=setTimeout(loop,hasBD()?200:500);
}
function stopScan(){clearTimeout(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').srcObject=null}
$('sc').addEventListener('close',stopScan);
$('scClose').onclick=()=>$('sc').close();
$('scPhoto').onclick=()=>{stopScan();$('scFile').click()};
$('scFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  $('scMsg').textContent='Reading photo\u2026';
  const code=await decodeBlob(f);
  if(code){$('sc').close();onCode(code)}
  else $('scMsg').textContent='No barcode found. Get closer, keep it flat and in focus, then tap Take photo again.';
};
$('scanBtn').onclick=()=>startScan('lookup');
$('fScan').onclick=()=>startScan('fill');
function onCode(code){
  if(mode==='fill'){const f=$('fNum');f.value=f.value.trim()?code+' / '+f.value.trim():code;return}
  const c=code.toLowerCase();
  const p=parts.find(x=>x.num.split('/').some(t=>t.trim().toLowerCase()===c));
  if(p){hitId=p.id;paintHit();$('hit').showModal()}
  else{openDlg(null);$('fNum').value=code}
}
function paintHit(){const p=parts.find(x=>x.id===hitId);$('hName').textContent=p.name;$('hNum').textContent=p.num;$('hQty').textContent=p.qty}
$('hInc').onclick=()=>{parts.find(x=>x.id===hitId).qty++;save();render();paintHit()};
$('hDec').onclick=()=>{const p=parts.find(x=>x.id===hitId);p.qty=Math.max(0,p.qty-1);save();render();paintHit()};
$('hEdit').onclick=()=>{$('hit').close();openDlg(parts.find(x=>x.id===hitId))};
$('hNext').onclick=()=>{$('hit').close();startScan('lookup')};
$('hDone').onclick=()=>$('hit').close();
load();
</script>
</body>
</html>
